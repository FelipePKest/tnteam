name: "model_based_teammate"
on_policy: True
runner: "parallel"

buffer_size: 64
batch_size_run: 8
batch_size: 64

action_selector: "soft_policies"
mask_before_softmax: True
agent_output_type: "pi_logits"

learner: "model_based_teammate_learner"
mac: "agent_owned_mac"
agent: "rnn_clam"
critic_type: "clam_critic"

obs_agent_id: True
obs_last_action: True
obs_state: False
obs_individual_obs: False
obs_team_composition: False

embed_dim: 32
teammate_model_hidden_dim: 128
teammate_planning_horizon: 3
teammate_planning_discount: 0.95
teammate_model_lr: 0.0003
teammate_target_tau: 0.01
teammate_action_loss_coef: 1.0
teammate_dynamics_loss_coef: 1.0
teammate_reward_loss_coef: 0.1
teammate_obs_loss_coef: 0.25
teammate_model_grad_norm_clip: 5.0

entropy_coef: 0.05
standardise_rewards: True
use_gae: True
gae_lambda: 0.95
q_nstep: 5
epochs: 5
n_minibatch: 1
eps_clip: 0.1
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
use_popart: False
clip_value_loss: False
use_huber_loss: False
huber_delta: 10.0
use_adv_std: True
use_obs_norm: True
use_orthogonal_init: True

trainable_agents_mask_actor: True
trainable_agents_mask_critic: True
mask_type: "team"

trained_agents:
  agent_0:
    agent_loader: "clam_train_agent_loader"
    agent_path: ""
