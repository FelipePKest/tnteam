name: "policy_repr_poam"
# --- Policy Representation POAM ---

runner: "parallel"

buffer_size: 256
batch_size_run: 8
batch_size: 256

on_policy: True
save_extra_stats: False


obs_agent_id: True
obs_last_action: True # POAM requires encoder to obs agents' last actions
obs_state: False # required for mappo critic
obs_individual_obs: False # used for cv_critic only
obs_team_composition: False 


action_selector: "soft_policies"
mask_before_softmax: True

# action_selector: "multinomial"
agent_output_type: "pi_logits"
learner: "policy_repr_poam_learner"
mac: "open_train_mac"
agent: "rnn_poam"

# Critic
critic_type: "poam_critic"
critic_train_mode: "seq"
critic_use_layer_norm: True
critic_use_orthogonal_init: True
critic_use_feature_norm: True

# PPO
use_gae: True
gae_lambda: 0.95
eps_clip: 0.2
epochs: 4
n_minibatch: 1
entropy_coef: 0.05
use_adv_std: True

# Rewards / values
standardise_rewards: True
standardise_returns: False
q_nstep: 5
add_value_last_step: True
use_huber_loss: True
huber_delta: 10.0
use_popart: False
clip_value_loss: False

# Actor
hidden_dim: 64
use_rnn: True
obs_agent_id: True
obs_last_action: True
use_obs_norm: False
use_orthogonal_init: True

# POAM / representation encoder
embed_dim: 64
ed_hidden_dim: 64
n_ed_hidden_layers: 1
ed_lr: 0.0005
ed_epochs: 1
n_ed_minibatch: 1
ed_pretrain_ts: 100000
ed_pretrain_epochs: 10000
ed_grad_norm_clip: 10
ed_bce_loss: False

# New policy representation objective
repr_lr: 0.0005
repr_epochs: 1
n_repr_minibatch: 1
repr_hidden_dim: 64
decoder_obs_coef: 1.0
decoder_act_coef: 1.0
repr_action_coef: 0.0
repr_type_coef: 0.25
repr_uncontrolled_only: True

n_policy_types: 5

# Open training masks
open_train_or_eval: True
trainable_agents_mask_actor: True
trainable_agents_mask_critic: True
ed_model_uncontrolled_only: False
mask_type: "team"

trained_agents:
  agent_0:
    agent_loader: poam_train_agent_loader
    agent_path: ""

# Optimisation
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 10
