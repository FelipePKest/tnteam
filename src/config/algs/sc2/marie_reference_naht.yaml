# NAHT adaptation of MARIE: EPyMARL composes controlled and fixed teammates,
# while the upstream MARIE learner models the joint trajectory and optimizes
# only slots marked by trainable_agents.
name: "marie_naht"
learner: "marie_reference_learner"
mac: "open_train_mac"
on_policy: false

trained_agents:
  agent_0:
    agent_loader: "marie_reference_train_agent_loader"
    agent_path: ""

# Upstream DreamerLearnerConfig remains the source of model/training settings.
batch_size_run: 1
batch_size: 1
buffer_size: 1
buffer_cpu_only: true
hidden_dim: 64
test_interval: 10000
test_nepisode: 8
marie_original_procedure: true
marie_reference_root: "/home/jupyter-jphuser3/MARIE"

# Sample one or two fixed teammates per episode on 3s_vs_5z.
n_uncontrolled: null

local_results_path: "3sv5z/open_train/marie-naht"
