# Classifier-only training over the five specialized CLAM embed32 experts.

name: "clam_lstm_classifier_only"
local_results_path: mpe-pp/open_train/clam_lstm_classifier_only

runner: "parallel"
mac: "open_train_mac"
env: "gymma"
non_overridable:
  - name
  - local_results_path
  - mac
  - learner
  - trained_agents
  - uncntrl_agents
  - n_uncontrolled
env_args:
  key: "mpe:PredatorPrey-v0"
  pretrained_wrapper: "PretrainedTag"
  time_limit: 100
  record_video: False
batch_size_run: 8
test_nepisode: 128
test_interval: 50000
test_greedy: true

log_interval: 50000
runner_log_interval: 50000
learner_log_interval: 50000
t_max: 40050000
use_cuda: true
buffer_cpu_only: true
log_discounted_return: false

classifier_architecture: "lstm"
classifier_hidden_dim: 128
classifier_layers: 2
classifier_dropout: 0.1
classifier_bidirectional: false
classifier_count_embed_dim: 8
classifier_lr: 0.0001
classifier_weight_decay: 0.0
classifier_history_len: 32
classifier_minibatch_size: 1024
classifier_d_model: 128
classifier_nhead: 4
classifier_ff: 256

use_tensorboard: true
save_model: true
save_model_interval: 1000000
checkpoint_path: ""
render: false

learner: "classifier_learner"
agent: "rnn_poam"
hidden_dim: 64
use_rnn: true
obs_agent_id: true
obs_last_action: true
obs_state: false
obs_individual_obs: false
obs_team_composition: false

gamma: 0.99
batch_size: 256
buffer_size: 256
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 10
add_value_last_step: true

# Compatibility settings for ClassifierLearner's unused POAM encoder.
ed_hidden_dim: 64
embed_dim: 64

test_verbose: false
save_replay: false
eval_mode: null
n_uncontrolled: null

# Ordering must match uncntrl_agents below because labels use insertion order.
trained_agents:
  agent_0:
    agent_loader: type_conditional_loader
    base_path: "."
    classifier:
      architecture: "lstm"
      history_len: 32
      hidden_dim: 128
      num_layers: 2
      dropout: 0.1
      bidirectional: false
      count_embed_dim: 8
    teammate_types:
      - name: ippo
        agent_loader: clam_eval_agent_loader
        agent_path: naht_results/mpe-pp/open_train/clam-vs-ippo/models/clam_embed32_specialized_ippo_seed=112358_07-20-00-13-14
        load_step: best
        test_mode: true
      - name: qmix
        agent_loader: clam_eval_agent_loader
        agent_path: naht_results/mpe-pp/open_train/clam-vs-qmix/models/clam_embed32_specialized_qmix_seed=112358_07-20-14-45-12
        load_step: best
        test_mode: true
      - name: vdn
        agent_loader: clam_eval_agent_loader
        agent_path: naht_results/mpe-pp/open_train/clam-vs-vdn/models/clam_embed32_specialized_vdn_seed=112358_07-20-19-30-57
        load_step: best
        test_mode: true
      - name: mappo
        agent_loader: clam_eval_agent_loader
        agent_path: naht_results/mpe-pp/open_train/clam-vs-mappo/models/clam_embed32_specialized_mappo_seed=112358_07-20-09-58-00
        load_step: best
        test_mode: true
      - name: iql
        agent_loader: clam_eval_agent_loader
        agent_path: naht_results/mpe-pp/open_train/clam-vs-iql/models/clam_embed32_specialized_iql_seed=112358_07-20-04-56-22
        load_step: best
        test_mode: true

uncntrl_agents:
  agent_ippo:
    agent_loader: rnn_eval_agent_loader
    agent_path: mpe-pp/ippo/models/ippo_baseline_seed=112358_07-10-14-39-17
    load_step: best
    n_agents_to_populate: 3
    test_mode: true
  agent_qmix:
    agent_loader: rnn_eval_agent_loader
    agent_path: mpe-pp/qmix/models/qmix_baseline_seed=112358_04-24-12-09-32
    load_step: best
    n_agents_to_populate: 3
    test_mode: true
  agent_vdn:
    agent_loader: rnn_eval_agent_loader
    agent_path: mpe-pp/vdn/models/vdn_baseline_seed=112358_04-24-12-11-09
    load_step: best
    n_agents_to_populate: 3
    test_mode: true
  agent_mappo:
    agent_loader: rnn_eval_agent_loader
    agent_path: mpe-pp/mappo/models/mappo_baseline_seed=112358_04-24-12-04-31
    load_step: best
    n_agents_to_populate: 3
    test_mode: true
  agent_iql:
    agent_loader: rnn_eval_agent_loader
    agent_path: mpe-pp/iql/models/iql_baseline_seed=112358_04-24-12-11-40
    load_step: best
    n_agents_to_populate: 3
    test_mode: true

repeat_id: 1
label: "classifier_lstm_clam_specialists"
hypergroup: null
